<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Update Job #{{ job.id }}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        function handleStatusChange(status) {
            const podSection = document.getElementById('pod-section');
            const podInput = document.getElementById('pod-input');
            const noteSection = document.getElementById('note-section');
            const noteInput = document.getElementById('note-input');
            const saveBtn = document.getElementById('save-btn');

            // Reset UI
            podInput.required = false;
            noteInput.required = false;
            podSection.classList.add('hidden');
            noteSection.classList.add('hidden');
            saveBtn.innerText = "Update Status";
            saveBtn.className = "w-full py-4 rounded-xl font-black text-white shadow-lg transition transform active:scale-95 bg-slate-900 hover:bg-slate-800";

            if (status === 'Delivered') {
                podSection.classList.remove('hidden');
                podInput.required = true;
                saveBtn.innerText = "Complete & Upload Proof";
                saveBtn.className = "w-full py-4 rounded-xl font-black text-white shadow-lg bg-emerald-600";
            } 
            else if (status === 'Issue') {
                noteSection.classList.remove('hidden');
                noteInput.required = true;
                saveBtn.innerText = "Report Issue";
                saveBtn.className = "w-full py-4 rounded-xl font-black text-white shadow-lg bg-red-600";
            }
            
            // TRIGGER GPS CAPTURE
            captureLocation();
        }

        function captureLocation() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(function(position) {
                    document.getElementById('lat').value = position.coords.latitude;
                    document.getElementById('lng').value = position.coords.longitude;
                    document.getElementById('gps-status').innerText = "📍 Location Captured";
                    document.getElementById('gps-status').classList.add("text-emerald-500");
                }, function(err) {
                    console.log("GPS Error");
                });
            }
        }
    </script>
</head>
<body class="bg-slate-100 min-h-screen pb-20 font-sans">

    <div class="max-w-lg mx-auto bg-white shadow-xl overflow-hidden md:rounded-2xl md:my-6">
        
        <div class="bg-slate-900 text-white p-6">
            <div class="flex justify-between items-start">
                <div>
                    <h1 class="text-2xl font-black">Update Status</h1>
                    <div class="text-slate-400 font-medium">{{ job.client_name }}</div>
                </div>
                <a href="/dashboard" class="text-xs bg-slate-800 px-3 py-1 rounded font-bold text-slate-300">Close</a>
            </div>
            <div id="gps-status" class="text-xs font-bold text-slate-500 mt-2 uppercase tracking-widest">Waiting for GPS...</div>
        </div>

        <form action="/update_job/{{ job.id }}" method="POST" enctype="multipart/form-data" class="p-6 space-y-8">
            
            <input type="hidden" name="lat" id="lat">
            <input type="hidden" name="lng" id="lng">

            <div class="space-y-3">
                <label class="flex items-center p-4 border-2 border-slate-100 rounded-xl cursor-pointer hover:bg-blue-50 group has-[:checked]:border-blue-600 has-[:checked]:bg-blue-50">
                    <input type="radio" name="status" value="In Transit" class="w-5 h-5 text-blue-600" onclick="handleStatusChange('In Transit')" {% if job.status == 'In Transit' %}checked{% endif %}>
                    <div class="ml-4">
                        <span class="block font-bold text-slate-800">In Transit</span>
                        <span class="block text-xs text-slate-500">Driving to location</span>
                    </div>
                </label>

                <label class="flex items-center p-4 border-2 border-slate-100 rounded-xl cursor-pointer hover:bg-emerald-50 group has-[:checked]:border-emerald-600 has-[:checked]:bg-emerald-50">
                    <input type="radio" name="status" value="Delivered" class="w-5 h-5 text-emerald-600" onclick="handleStatusChange('Delivered')" {% if job.status == 'Delivered' %}checked{% endif %}>
                    <div class="ml-4">
                        <span class="block font-bold text-slate-800">Delivered</span>
                        <span class="block text-xs text-slate-500">Arrived & Complete</span>
                    </div>
                </label>

                <label class="flex items-center p-4 border-2 border-slate-100 rounded-xl cursor-pointer hover:bg-red-50 group has-[:checked]:border-red-600 has-[:checked]:bg-red-50">
                    <input type="radio" name="status" value="Issue" class="w-5 h-5 text-red-600" onclick="handleStatusChange('Issue')" {% if job.status == 'Issue' %}checked{% endif %}>
                    <div class="ml-4">
                        <span class="block font-bold text-slate-800">Issue / Delay</span>
                        <span class="block text-xs text-slate-500">Problem reported</span>
                    </div>
                </label>
            </div>

            <div id="pod-section" class="hidden bg-emerald-50 p-4 rounded-xl border border-emerald-100">
                <label class="block text-sm font-bold text-emerald-800 mb-2">📸 Upload Proof (Required)</label>
                <input type="file" id="pod-input" name="pod_photo" accept="image/*" class="w-full text-sm text-slate-500">
            </div>

            <div id="note-section" class="hidden bg-red-50 p-4 rounded-xl border border-red-100">
                <label class="block text-sm font-bold text-red-800 mb-2">📝 Explain Delay</label>
                <textarea id="note-input" name="note" rows="3" class="w-full p-3 border border-red-200 rounded-lg text-sm"></textarea>
            </div>

            <button type="submit" id="save-btn" class="w-full py-4 rounded-xl font-black text-white shadow-lg bg-slate-900">
                Update Status
            </button>
        </form>
    </div>
    
    <script>
        // Capture GPS immediately on load just in case
        captureLocation();
    </script>
</body>
</html>
