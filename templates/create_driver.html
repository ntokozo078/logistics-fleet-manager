<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add New Driver</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>

<body class="bg-slate-50 min-h-screen">

    <nav class="bg-white border-b border-slate-200 px-6 py-4 fixed top-0 w-full z-50 flex justify-between items-center shadow-sm">
        <div class="flex items-center gap-2">
            <div class="w-8 h-8 bg-blue-600 rounded-lg flex items-center justify-center text-white font-black text-lg">L</div>
            <span class="font-bold text-xl text-slate-800 tracking-tight">Logistics<span class="text-blue-600">Pro</span></span>
        </div>
        
        <div class="flex items-center gap-6 text-sm font-bold">
            <a href="{{ url_for('dashboard') }}" class="text-slate-500 hover:text-blue-600 transition flex items-center gap-2">
                <i class="fas fa-chart-line"></i> Dashboard
            </a>
            <a href="{{ url_for('admin_drivers') }}" class="text-slate-500 hover:text-blue-600 transition flex items-center gap-2">
                <i class="fas fa-truck"></i> Fleet
            </a>
            <div class="h-4 w-px bg-slate-300"></div>
            <a href="{{ url_for('logout') }}" class="text-red-500 hover:text-red-700 transition flex items-center gap-2">
                <i class="fas fa-sign-out-alt"></i> Logout
            </a>
        </div>
    </nav>

    <div class="flex items-center justify-center min-h-screen pt-24 pb-12 px-4">
        
        <div class="bg-white w-full max-w-md rounded-2xl shadow-xl border border-slate-200 p-8">

            <div class="text-center mb-6">
                <h2 class="text-2xl font-bold text-slate-800">Register New Driver</h2>
                <p class="text-sm text-slate-500">Upload their photo and set login details.</p>
            </div>

            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    {% for category, message in messages %}
                    <div class="mb-4 p-3 rounded-lg text-sm font-bold border 
                                {{ 'bg-red-50 text-red-700 border-red-200' if category == 'danger' else 'bg-green-50 text-green-700 border-green-200' }}">
                        <i class="fas fa-info-circle me-2"></i>{{ message }}
                    </div>
                    {% endfor %}
                {% endif %}
            {% endwith %}

            <form action="{{ url_for('create_driver') }}" method="POST" enctype="multipart/form-data" class="space-y-4">

                <div class="flex flex-col items-center mb-4">
                    <div class="w-24 h-24 bg-slate-100 rounded-full flex items-center justify-center border-2 border-dashed border-slate-300 mb-2 overflow-hidden relative group">
                        <img id="preview" src="/static/default_avatar.png" 
                             onerror="this.src='https://via.placeholder.com/100?text=+'"
                             class="w-full h-full object-cover opacity-50 transition group-hover:opacity-75">
                        
                         <div class="absolute inset-0 flex items-center justify-center opacity-0 group-hover:opacity-100 transition">
                            <i class="fas fa-camera text-slate-600"></i>
                         </div>
                    </div>
                    <label class="cursor-pointer bg-white border border-slate-300 text-slate-700 px-4 py-1 rounded-full text-xs font-bold hover:bg-slate-50 transition shadow-sm">
                        Upload Photo
                        <input type="file" name="driver_photo" accept="image/*" class="hidden" onchange="loadFile(event)">
                    </label>
                </div>

                <div>
                    <label class="block text-sm font-bold text-slate-700 mb-1">Driver Username</label>
                    <div class="relative">
                        <span class="absolute left-3 top-3 text-slate-400"><i class="fas fa-user"></i></span>
                        <input type="text" name="username" placeholder="e.g. driver_sandile" required
                            class="w-full pl-10 p-3 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition">
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-bold text-slate-700 mb-1">Email Address</label>
                    <div class="relative">
                        <span class="absolute left-3 top-3 text-slate-400"><i class="fas fa-envelope"></i></span>
                        <input type="email" name="email" placeholder="e.g. sandile@logistics.co.za" required
                            class="w-full pl-10 p-3 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition">
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-bold text-slate-700 mb-1">Phone Number</label>
                    <div class="flex">
                        <span class="inline-flex items-center px-3 text-sm text-slate-600 bg-slate-100 border border-r-0 border-slate-300 rounded-l-lg font-bold">
                            🇿🇦 +27
                        </span>
                        <input type="tel" name="phone" placeholder="72 123 4567" required pattern="[0-9]{9}"
                            class="w-full p-3 border border-slate-300 rounded-r-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition">
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-bold text-slate-700 mb-1">Set Password</label>
                    <div class="relative">
                        <span class="absolute left-3 top-3 text-slate-400"><i class="fas fa-lock"></i></span>
                        <input type="text" name="password" placeholder="e.g. truck123" required
                            class="w-full pl-10 p-3 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition">
                    </div>
                </div>

                <div class="pt-4 flex gap-3">
                    <button type="submit"
                        class="flex-1 bg-blue-600 text-white font-bold py-3 rounded-lg hover:bg-blue-700 shadow-lg shadow-blue-600/20 transition transform hover:-translate-y-0.5">
                        Create Account
                    </button>
                    <a href="{{ url_for('dashboard') }}"
                        class="flex-1 bg-white text-slate-600 font-bold py-3 rounded-lg hover:bg-slate-50 transition text-center border border-slate-200">
                        Cancel
                    </a>
                </div>
            </form>
        </div>
    </div>

    <script>
        var loadFile = function (event) {
            var output = document.getElementById('preview');
            if(event.target.files && event.target.files[0]) {
                output.src = URL.createObjectURL(event.target.files[0]);
                output.classList.remove("opacity-50");
                output.onload = function () {
                    URL.revokeObjectURL(output.src) 
                }
            }
        };
    </script>
</body>
</html>
